  /ws:
    get:
      tags:
        - WebSocket Real-Time
      summary: "Full-duplex WebSocket connection for real-time messaging & WebRTC signaling"
      description: |
          Upgrades connection to bidirectional WebSocket protocol.
          **Connection URLs**:
          - `ws://localhost:8080/ws?token=<session_token>&v=1.4.3`
          - Or pass `Authorization: Bearer <session_token>` header during handshake.
          
          **Client-Allowed Events (Client → Server)**:
          - `typing`: Informs channel members of user typing activity (`{"channel_id": "..."}`)
          - `call_offer`: Initiates WebRTC SDP offer to target user or channel
          - `call_answer`: WebRTC SDP answer
          - `call_candidate`: ICE candidate trickle
          - `call_join`, `call_leave`, `call_reject`, `call_busy`: Call session state control
          
          **Server Broadcast Events (Server → Client)**:
          - `message`: New encrypted or plaintext message arrived (delivered strictly to channel members)
          - `typing`: Member typing indicator
          - `user_online`, `user_offline`: Presence updates
          - `channel_created`: Added to new channel
          - `channel_deleted`: Channel was removed
          - `message_reaction`: Reaction was added/removed
          - `messages_read`: Read receipts updated
          - `session_revoked`: Device session terminated remotely
          - `system_alert`: Important service or security notification
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Session token if Authorization header is unsupported by WebSocket client
        - name: v
          in: query
          required: false
          schema:
            type: string
            example: 1.4.3
          description: "Client version. If <= 1.4.2, server pushes mandatory update warning event."
      responses:
        101:
          description: Switching Protocols to WebSocket. All subsequent communication occurs over the socket in JSON-encoded frames conforming to the WebSocketEvent schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketEvent"
        401:
          description: "Unauthorized: Invalid or expired session token"
